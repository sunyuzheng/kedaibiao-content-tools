name: Private Podcast Sync

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan, execute one reviewed plan, or apply the private publication policy"
        type: choice
        options:
          - plan
          - publish
          - auto
        default: plan
        required: true
      plan_run_id:
        description: "Successful plan producer run ID (publish only)"
        type: string
        required: false
      plan_hash:
        description: "Exact reviewed plan hash (publish only)"
        type: string
        required: false
      approval_hash:
        description: "Exact reviewed publish scope hash (publish only)"
        type: string
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: transistor-show-71709
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'sunyuzheng/kedaibiao-podcast-ops' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REQUESTED_MODE: ${{ inputs.mode || 'auto' }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      PLAN_HASH: ${{ inputs.plan_hash }}
      APPROVAL_HASH: ${{ inputs.approval_hash }}
    steps:
      - name: Verify private operations repository
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "sunyuzheng/kedaibiao-podcast-ops" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(gh repo view "$GITHUB_REPOSITORY" --json isPrivate --jq .isPrivate)" == "true" ]]
          case "$REQUESTED_MODE" in
            plan|auto) ;;
            publish)
              [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
              [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]
              [[ "$PLAN_HASH" =~ ^[0-9a-f]{64}$ ]]
              [[ "$APPROVAL_HASH" =~ ^[0-9a-f]{64}$ ]]
              ;;
            *) exit 1 ;;
          esac

      - name: Checkout private state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: ops
          fetch-depth: 0
          persist-credentials: true

      - name: Validate pinned application revision
        id: code
        shell: bash
        run: |
          set -euo pipefail
          APP_SHA="$(cat ops/code-version.txt)"
          [[ "$APP_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$APP_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned public application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sunyuzheng/kedaibiao-content-tools
          ref: ${{ steps.code.outputs.sha }}
          path: app
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements-cloud-podcast.txt

      - name: Install pinned application dependencies and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          python -m venv app/.venv-podcast
          app/.venv-podcast/bin/python -m pip install -r app/requirements-cloud-podcast.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify and download the exact reviewed plan
        if: env.REQUESTED_MODE == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["PLAN_RUN_ID"]
          if repo != "sunyuzheng/kedaibiao-podcast-ops" or not re.fullmatch(r"[0-9]+", run_id):
              raise SystemExit("Invalid plan producer identity")

          def get(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))

          workflow = get(f"repos/{repo}/actions/workflows/podcast-sync.yml")
          run = get(f"repos/{repo}/actions/runs/{run_id}")
          if not all((
              run.get("repository", {}).get("full_name") == repo,
              run.get("head_repository", {}).get("full_name") == repo,
              run.get("head_branch") == "main",
              run.get("path") == ".github/workflows/podcast-sync.yml",
              run.get("workflow_id") == workflow.get("id"),
              run.get("status") == "completed",
              run.get("conclusion") == "success",
              run.get("event") in {"schedule", "workflow_dispatch"},
          )):
              raise SystemExit("Plan producer is not a successful trusted main workflow run")
          artifacts = get(f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100")
          candidates = [a for a in artifacts.get("artifacts", []) if a.get("name") == "podcast-plan"]
          if len(candidates) != 1 or candidates[0].get("expired"):
              raise SystemExit("Expected one unexpired podcast-plan artifact")
          subprocess.run([
              "gh", "run", "download", run_id, "--repo", repo,
              "--name", "podcast-plan", "--dir",
              os.path.join(os.environ["GITHUB_WORKSPACE"], "app", "logs", "cloud", "bundle"),
          ], check=True)
          PY

      - name: Run the cloud synchronizer
        id: cloud
        env:
          TRANSISTOR_API_KEY: ${{ secrets.TRANSISTOR_API_KEY }}
          TRANSISTOR_SHOW_ID: "71709"
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            --ops "$GITHUB_WORKSPACE/ops"
            --mode "$REQUESTED_MODE"
            --bundle "$GITHUB_WORKSPACE/app/logs/cloud/bundle"
          )
          if [[ "$REQUESTED_MODE" == "publish" ]]; then
            ARGS+=(--plan-hash "$PLAN_HASH" --approval-hash "$APPROVAL_HASH")
          fi
          app/.venv-podcast/bin/python app/tools/automation/cloud_podcast.py "${ARGS[@]}"

      - name: Persist state after success or failure
        if: always() && steps.guard.outcome == 'success' && steps.cloud.outcome != 'skipped'
        env:
          GIT_AUTHOR_NAME: Yuzheng Sun
          GIT_AUTHOR_EMAIL: sunyuzheng@gmail.com
          GIT_COMMITTER_NAME: Yuzheng Sun
          GIT_COMMITTER_EMAIL: sunyuzheng@gmail.com
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ops/runtime/state.json ]]; then
            git -C ops add -- runtime/state.json
            if ! git -C ops diff --cached --quiet -- runtime/state.json; then
              git -C ops commit --only -m "Checkpoint podcast runtime state" -- runtime/state.json
              git -C ops push origin HEAD:main
            fi
          fi

      - name: Save the immutable plan bundle
        if: success() && env.REQUESTED_MODE != 'publish'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: podcast-plan
          path: app/logs/cloud/bundle/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save private sanitized receipt
        if: always() && steps.guard.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: podcast-receipt
          path: app/logs/cloud/receipt.json
          if-no-files-found: ignore
          retention-days: 14
