name: Validate Podcast Cloud Runner

on:
  push:
    paths:
      - "tools/automation/**"
      - "tools/check/**"
      - "tools/podcast/**"
      - "tools/upload/**"
      - "tools/youtube/**"
      - "tests/test_podcast*.py"
      - "tests/test_transistor*.py"
      - "tests/test_cloud*.py"
      - "requirements-cloud-podcast.txt"
      - "deployment/podcast-ops/**"
      - ".github/workflows/podcast-cloud-validation.yml"
  pull_request:
    paths:
      - "tools/automation/**"
      - "tools/check/**"
      - "tools/podcast/**"
      - "tools/upload/**"
      - "tools/youtube/**"
      - "tests/test_podcast*.py"
      - "tests/test_transistor*.py"
      - "tests/test_cloud*.py"
      - "requirements-cloud-podcast.txt"
      - "deployment/podcast-ops/**"
      - ".github/workflows/podcast-cloud-validation.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cloud-podcast.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-cloud-podcast.txt
      - name: Run offline tests
        run: |
          python -m unittest discover -s tests -p 'test_podcast*.py' -v
          python -m unittest discover -s tests -p 'test_transistor*.py' -v
          python -m unittest discover -s tests -p 'test_cloud*.py' -v
      - name: Compile Python source
        run: python -m compileall -q tools/automation tools/check tools/podcast tools/upload tools/youtube tests
