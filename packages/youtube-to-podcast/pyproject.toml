[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-to-podcast"
version = "0.1.0"
description = "Plan-first, hash-approved YouTube to podcast publishing."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Yuzheng Sun" },
]
keywords = ["youtube", "podcast", "transistor", "yt-dlp", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "requests>=2.31,<3",
  "yt-dlp>=2025.1.15",
]

[project.scripts]
youtube-to-podcast = "youtube_to_podcast.cli:main"

[project.urls]
Homepage = "https://github.com/sunyuzheng/kedaibiao-content-tools"
Issues = "https://github.com/sunyuzheng/kedaibiao-content-tools/issues"

[tool.setuptools.packages.find]
where = ["src"]
